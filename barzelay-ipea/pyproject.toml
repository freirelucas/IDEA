[project]
name = "barzelay-ipea"
version = "0.1.0"
description = "Classificação sistemática do repositório IPEA quanto a marcadores de idealização (Barzelay)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Lucas Freire Silva", email = "lucas.silva@ipea.gov.br" },
]

dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "anthropic>=0.39",
    "docling>=2.0",
    "pymupdf>=1.24",
    "pydantic>=2.0",
    "streamlit>=1.40",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jupyter>=1.1",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
